[tool.poetry]
name = "your-own-ai-analyst"
version = "0.1.0"
description = "Your own AI data analyst: drop in your data, ask a business question, get a checked brief with charts. Runs inside Claude Code."
authors = ["Valentina Sanchez"]
readme = "README.md"
packages = [{ include = "helpers" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
pandas = "^2.0.0"
matplotlib = "^3.7.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
